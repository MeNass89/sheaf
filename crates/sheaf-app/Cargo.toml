[package]
name = "sheaf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sheaf desktop app"

[[bin]]
name = "sheaf-app"
path = "src/main.rs"

[dependencies]
# Local time for dynamic stamps ("By … at 2:14 pm, Oct 02, 2026"); already in the graph through PdfCraft.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sheaf-core = { path = "../sheaf-core" }
slint = { workspace = true, features = ["unstable-winit-030", "raw-window-handle-06"] }
rfd.workspace = true
# The system language, ticked first in OCR's languages (already in the tree through slint).
sys-locale = "0.3.2"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
pdfium-render.workspace = true
tempfile.workspace = true
lopdf.workspace = true
# ⌘V of an image onto a page (reader). Already in the graph through Slint; images too here.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

# "Open With" from Finder (src/open_with.rs). Same versions winit and rfd already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[build-dependencies]
slint-build.workspace = true
