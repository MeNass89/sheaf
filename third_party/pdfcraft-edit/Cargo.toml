# PdfCraft's page content editing (https://github.com/storytold/pdfcraft, crates/edit, MIT OR Apache-2.0) at
# rev d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24, with the header, footer and watermark font change: see ../README.md.
[package]
name = "pdfcraft-edit"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Page content editing: headers and footers, watermarks, backgrounds, Bates numbers (ISO 32000-2 §14.8)"

