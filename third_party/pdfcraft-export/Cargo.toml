# PdfCraft's export to HTML, Word and RTF (https://github.com/storytold/pdfcraft, crates/export, MIT OR Apache-2.0)
# at rev d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24, with the PDF to Word changes of F-005: see ../README.md.
[package]
name = "pdfcraft-export"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Export a PDF to HTML, Word (.docx) and RTF from its paragraphs and images"

[dependencies]
flate2 = "1"
