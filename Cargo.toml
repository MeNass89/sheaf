[workspace]
resolver = "3"
members = ["crates/sheaf-core", "crates/sheaf-cli", "crates/sheaf-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MeNass89/sheaf"

[workspace.dependencies]
pdfium-render = "0.9.4"
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
thiserror = "2"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
slint = "1.18.1"
slint-build = "1.18.1"
rfd = "0.17"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
