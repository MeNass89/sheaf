[workspace]
resolver = "3"
members = ["crates/sheaf-core", "crates/sheaf-cli", "crates/sheaf-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MeNass89/sheaf"

[workspace.dependencies]
pdfium-render = "0.9.4"
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
thiserror = "2"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
slint = "1.18.1"
slint-build = "1.18.1"
rfd = "0.17"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
parking_lot = "0.12"
unicode-normalization = "0.1"
rust_xlsxwriter = { version = "0.99", default-features = false }
calamine = { version = "0.31", default-features = false }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
pdfcraft-export = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }

# PdfCraft's engine builds only against its own forks of these crates (same git rev).
# The patch applies to the whole workspace, so our lopdf is PdfCraft's patched 0.45.0.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "d3a91c5c5f7b33dd39bc2ed8b5d3916960736d24" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
