name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and its clippy; rustup installs both on first use.
      - uses: Swatinem/rust-cache@v2
      - name: Tools the tests compare against
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # softhsm: the PKCS #11 token sheaf-core/tests/pkcs11.rs signs with.
            brew install qpdf poppler ghostscript softhsm
          else
            sudo apt-get update
            # The GUI layer of scripts/test.sh drives the app on Xvfb with xdotool; softhsm2 is the
            # PKCS #11 token sheaf-core/tests/pkcs11.rs and the smart card steps sign with (opensc's
            # pkcs11-tool writes the steps' certificate on it).
            sudo apt-get install -y qpdf ghostscript poppler-utils libfontconfig1-dev libxkbcommon-dev libudev-dev \
              xvfb xdotool xclip imagemagick x11-utils libxkbcommon-x11-0 softhsm2
            sudo apt-get install -y --no-install-recommends opensc
          fi
      - run: sh scripts/fetch-pdfium.sh && sh scripts/fetch-models.sh && sh scripts/fetch-fonts.sh
      - run: bash scripts/test.sh

  windows:
    # The test suite shells out to qpdf, poppler and a POSIX shell: on Windows, the release
    # build is packaged and the command line run on a real PDF.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: sh scripts/package-windows.sh
      - name: Smoke test
        run: sh scripts/smoke.sh target/Sheaf-*-windows-x64/sheaf-cli.exe
      # The portable zip kept a week, to try a branch on Windows before a release.
      - uses: actions/upload-artifact@v4
        with:
          name: sheaf-windows-x64
          path: target/Sheaf-*-windows-x64.zip
          retention-days: 7
